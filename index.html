<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly World News</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8202f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="World News">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#d9d6cc;--ink:#1a1a1a;--paper:#fff;--red:#c8202f;--ui:#2b2b2b;--uitxt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--ui:#3a3a3d;--ink:#eee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1e;--ui:#3a3a3d;--ink:#eee;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.wrap{max-width:460px;margin:0 auto;padding:16px}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:14px}
select,button{font:inherit;font-size:15px;padding:10px 12px;border:0;border-radius:6px;background:var(--ui);color:var(--uitxt)}
select{flex:1;min-width:0}button{cursor:pointer;white-space:nowrap}
.tab.on{background:var(--paper);color:#111}.go{background:var(--red)}
.box{background:var(--paper);border:4px solid #111;padding:18px 16px 14px;color:#1a1a1a}
.head{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase;padding:8px 14px;margin:0 0 14px -2px;letter-spacing:-.5px}
.box p{margin:0 0 6px;text-indent:1.2em;font-size:15.5px;line-height:1.4}.box p.f{text-indent:0}
.lk{display:flex;gap:14px;align-items:center;margin:0 0 12px;font-size:12px}
.lk a{color:#8a1a24;text-decoration:none;border-bottom:1px dotted #8a1a24}
.tag{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#666}
.ch{background:#cfe6f5;border:4px solid #111;padding:14px 16px;color:#111}
.ch .t{font:italic 900 46px/1 Impact,"Arial Black",sans-serif;color:var(--red);transform:rotate(-4deg);margin:2px 0 14px}
.ch .d{font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;margin:0 0 10px;letter-spacing:-.5px}
.ch .s{display:inline-block;color:#fff;font-weight:800;font-size:14px;text-transform:uppercase;padding:4px 10px;margin:10px 0 4px;min-width:55%}
.ch .r{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #6a7a88;font-size:15px;line-height:1.3}
.ch .r b{width:14px;flex:none}.ch .r span{flex:1}
.ch .r i{font-style:normal;display:flex;gap:8px;font-size:11px;align-items:center;flex:none}
.ch .r i a{color:#2a5d85;text-decoration:none;border-bottom:1px dotted #2a5d85}
.ch .src{font-size:11px;margin-top:10px;color:#345}
.msg{font-size:12px;opacity:.8;text-align:center;margin-top:12px;min-height:16px}
.sp{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.spi{max-width:460px;margin:0 auto;padding:16px}.sph{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.sp h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin:24px 0 10px;opacity:.7}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}.row span{flex:1}.row select{flex:none;padding:6px 8px}
</style></head><body>
<div class="wrap">
<div class="ctl"><button id="prev" aria-label="Previous month">&larr;</button><select id="m" aria-label="Month"></select><select id="y" aria-label="Year"></select><button id="next" aria-label="Next month">&rarr;</button></div>
<div class="ctl"><button class="tab on" id="tn">News</button><button class="tab" id="tc">Charts</button><button class="go" id="more" style="flex:1">Show different stories</button><button id="gear" aria-label="Settings" style="font-size:20px;padding:6px 14px">&#9881;</button></div>
<div class="box" id="box"></div>
<div class="msg" id="msg"></div>
</div>
<div class="sp" id="sp" style="display:none"><div class="spi">
<div class="sph"><b>Settings</b><button class="go" id="spx">Done</button></div>
<h3>Edition</h3><div class="row"><span>Show stories from</span><select id="ed_sel"><option value="all">All editions</option><option value="magazine">Magazine page only</option><option value="researched">Researched only</option></select></div>
<h3>News topics and priorities</h3><div id="tl"></div>
<h3>Export</h3><button id="exb" style="width:100%">Export this year as e-book (EPUB)</button>
</div></div>
<script src="data/bundle.js"></script>
<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const TOPICS=[
  {key:"business",name:"Business and economy",p:2},
  {key:"film",name:"Film and TV",p:2},
  {key:"music",name:"Music",p:2},
  {key:"deaths",name:"Notable deaths",p:2},
  {key:"politics",name:"Politics and world events",p:1},
  {key:"science",name:"Science and space",p:2},
  {key:"sport",name:"Sport",p:2},
  {key:"tech",name:"Technology",p:2},
  {key:"games",name:"Video games",p:3},
  {key:"wrestling",name:"Wrestling",p:3}
];
const PRIORITY_WEIGHTS=[0,1,2,4]; // Off, Low, Med, High
const $=i=>document.getElementById(i);
const mS=$("m"),yS=$("y"),box=$("box");

MONTHS.forEach((n,i)=>mS.add(new Option(n,i)));
for(let y=1970;y<=2010;y++) yS.add(new Option(y,y));
mS.value=1; yS.value=1988; // Default pilot start: February 1988

let tab="n";
let currentData=null;
let poolOffset=0;
let userPriorities={};
TOPICS.forEach(t=>userPriorities[t.key]=t.p);

const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ap=s=>(s||"").replace(/(\w)'(\w)/g,"$1\u2019$2").replace(/'(\d\d)/g,"\u2019$1");
const W=q=>"https://en.wikipedia.org/w/index.php?search="+encodeURIComponent(q);
const Y=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const fmt=t=>esc(ap(t)).replace(/^(\d{1,2}\s+[A-Za-z]+)/,"<b>$1</b>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
const A=(h,t)=>'<a href="'+h+'" target="_blank" rel="noopener">'+t+' \u2197</a>';

function getVisibleStories(){
  if(!currentData||!currentData.news||!currentData.news.length) return [];
  const ed=$("ed_sel").value;
  let pool=currentData.news.filter(n=>{
    if(ed==="magazine" && n.edition!=="Magazine page" && n.status!=="from_magazine") return false;
    if(ed==="researched" && n.edition!=="Researched") return false;
    const prio=userPriorities[n.topic]!==undefined?userPriorities[n.topic]:2;
    return prio>0;
  });

  if(!pool.length) return [];

  // Sort by topic priority weight and importance
  pool.sort((a,b)=>{
    const wa=(PRIORITY_WEIGHTS[userPriorities[a.topic]||2]*10)+(a.importance||3);
    const wb=(PRIORITY_WEIGHTS[userPriorities[b.topic]||2]*10)+(b.importance||3);
    return wb-wa;
  });

  // Pick up to 4 stories based on poolOffset
  const count=Math.min(4, pool.length);
  const picked=[];
  for(let i=0;i<count;i++){
    const idx=(poolOffset+i)%pool.length;
    picked.push(pool[idx]);
  }
  return picked;
}

function news(){
  box.className="box";
  const stories=getVisibleStories();
  if(!stories.length){
    box.innerHTML='<div class="head">'+MONTHS[+mS.value]+'<br>World News</div><p class="f">No stories match your topic filters for this month.</p>';
    return;
  }
  box.innerHTML='<div class="head">'+MONTHS[+mS.value]+'<br>World News</div>'+stories.map(n=>{
    const tag=n.edition|| (n.status==="from_magazine"?"Magazine page":"Researched");
    const srcLink=n.source&&n.source.startsWith("http")?A(n.source,"Source"):"";
    return '<p>'+fmt(n.text)+'</p><div class="lk">'+A(W(n.wiki),"Wikipedia")+A(Y(n.youtube),"YouTube")+srcLink+'<span class="tag">'+esc(tag)+'</span></div>';
  }).join("");
}

function charts(){
  box.className="ch";
  const cols=["#0a9bd8","#e8892b","#4da22f","#111"];
  if(!currentData||!currentData.charts||!currentData.charts.length){
    box.innerHTML='<div class="t">Charts</div><div class="d">'+MONTHS[+mS.value]+'<br>'+yS.value+'</div><p>No charts available for this month.</p>';
    return;
  }
  const monthName=MONTHS[+mS.value];
  const yr=yS.value;
  box.innerHTML='<div class="t">Charts</div><div class="d">'+monthName+'<br>'+yr+'</div>'+currentData.charts.map((c,i)=>{
    const mus=c.kind==="music";
    const srcText=c.source?esc(c.source):(currentData.chartSource?esc(currentData.chartSource):"");
    return '<div class="s" style="background:'+cols[i%4]+'"><a href="'+W(mus?"UK Singles Chart "+monthName+" "+yr:c.section)+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:none">'+esc(c.section)+' \u2197</a></div>'+(c.entries||[]).map(e=>{
      const who=(e.by||"").split(/\s+featuring\s+/i)[0];
      return '<div class="r"><b>'+e.pos+'</b><span>'+esc(ap(e.title))+' ('+esc(e.by)+')</span><i>'+A(W(mus?e.title+" "+who+" song":e.title+" video game"),"Wiki")+A(Y(mus?who+" "+e.title:e.title+" "+c.section),"YouTube")+'</i></div>';
    }).join("")+(c.source?'<div class="src" style="font-size:10px;margin-bottom:6px">Source: '+esc(c.source)+'</div>':'');
  }).join("")+(currentData.chartSource?'<div class="src">Chart Source: '+esc(currentData.chartSource)+'</div>':'');
}

async function loadData(y,m){
  const mm=String(m+1).padStart(2,"0");
  const key=`${y}-${mm}`;
  // 1. Direct bundle access: works offline and directly via file:// in any browser
  if(window.ALL_DATA && window.ALL_DATA[key]){
    return window.ALL_DATA[key];
  }
  // 2. Fetch fallback: works on web hosting like GitHub Pages
  const path=`data/${key}.json`;
  try{
    const res=await fetch(path);
    if(!res.ok) throw new Error("File not found");
    return await res.json();
  }catch(err){
    return null;
  }
}

async function show(){
  $("msg").textContent="";
  const y=+yS.value, m=+mS.value;
  currentData=await loadData(y,m);
  poolOffset=0;

  if(!currentData){
    $("more").disabled=true;
    box.className="box";
    box.innerHTML='<div class="head">'+MONTHS[m]+'<br>'+(tab==="c"?"Charts":"World News")+'</div><p class="f">No data for '+MONTHS[m]+' '+y+' in this preview. In the finished app, every month from 1970 to 2010 would be filled in ahead of time.</p>';
    return;
  }

  $("more").disabled=(currentData.news||[]).length<=4;
  tab==="c"?charts():news();
}

function step(d){
  let m=+mS.value+d, y=+yS.value;
  if(m<0){m=11;y--}else if(m>11){m=0;y++}
  if(y<1970||y>2010) return;
  mS.value=m; yS.value=y;
  show();
}

function setTab(t){
  tab=t;
  $("tn").classList.toggle("on",t==="n");
  $("tc").classList.toggle("on",t==="c");
  if(currentData){
    tab==="c"?charts():news();
  }
}

$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
mS.onchange=show;
yS.onchange=show;
$("tn").onclick=()=>setTab("n");
$("tc").onclick=()=>setTab("c");

$("more").onclick=()=>{
  if(!currentData||!currentData.news) return;
  const pool=getVisibleStories();
  if((currentData.news||[]).length>4){
    poolOffset=(poolOffset+2)%currentData.news.length;
    news();
    $("msg").textContent="Showing different stories from the pool.";
  }else{
    $("msg").textContent="All available stories for this month are currently shown.";
  }
};

$("gear").onclick=()=>{$("sp").style.display="block"};
$("spx").onclick=()=>{$("sp").style.display="none"; if(currentData&&tab==="n") news();};
$("ed_sel").onchange=()=>{if(currentData&&tab==="n") news();};
$("exb").onclick=()=>{$("exb").textContent="Export would build the EPUB here"};

$("tl").innerHTML=TOPICS.map(t=>{
  const p=userPriorities[t.key];
  return '<div class="row"><span>'+t.name+'</span><select data-topic="'+t.key+'">'+
    ["Off","Low","Medium","High"].map((opt,i)=>'<option value="'+i+'"'+(p===i?" selected":"")+'>'+opt+'</option>').join("")+
    '</select></div>';
}).join("");

$("tl").querySelectorAll("select").forEach(sel=>{
  sel.onchange=()=>{
    userPriorities[sel.dataset.topic]=+sel.value;
  };
});

show();
</script></body></html>
